# Checks The Stanford Daily every morning and adds any new column to the site.
name: Update Stanford Daily articles

on:
  schedule:
    - cron: "0 15 * * *"   # every day, ~7–8am Pacific
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_daily.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update Stanford Daily articles"
            git push
          fi
